<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>runthrough · label</title>
<style>
:root {
  --bg: #f6f7fa; --surface: #fff; --fg: #151a2c; --muted: #5a6179; --line: #dce0ea;
  --accent: #2f48c9; --accent-soft: #e6eafb; --user: #b9720f; --user-soft: #fbf0de;
  --pass: #1e7a4c; --pass-soft: #e2f3ea; --fail: #b42b2b; --fail-soft: #fbe6e6;
  --code: #eef0f6;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1120; --surface: #161a2c; --fg: #e5e8f2; --muted: #9aa2bc; --line: #272d45;
    --accent: #8299ff; --accent-soft: #1d2547; --user: #ebaa4a; --user-soft: #33270f;
    --pass: #5cc892; --pass-soft: #13301f; --fail: #ff8a8a; --fail-soft: #3a1616; --code: #12162a;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.55 var(--sans); }
header { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 20px; }
header h1 { font-size: 15px; margin: 0 12px 0 0; }
header .progress { color: var(--muted); font-variant-numeric: tabular-nums; }
header .spacer { flex: 1; }
button, select { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
kbd { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }
main { display: grid; grid-template-columns: minmax(0, 3fr) minmax(300px, 2fr); gap: 20px; padding: 20px; max-width: 1400px; margin: 0 auto; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } aside { position: static; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.meta { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
.meta b { color: var(--fg); font-weight: 600; }
.entry { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .who { display: block; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.user { background: var(--user-soft); } .user .who { color: var(--user); }
.assistant { background: var(--accent-soft); } .assistant .who { color: var(--accent); }
.tool_call, .tool_result { background: var(--code); font: 13px/1.5 var(--mono); margin-left: 24px; }
.tool_call .who, .tool_result .who { color: var(--muted); font-family: var(--sans); }
.tool_result .body { max-height: 220px; overflow: auto; display: block; }
.error { background: var(--fail-soft); margin-left: 24px; } .error .who { color: var(--fail); }
aside { display: grid; gap: 12px; align-content: start; position: sticky; top: 76px; max-height: calc(100vh - 96px); overflow: auto; }
h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.summary { color: var(--muted); font-size: 14px; margin: 0; }
.verdict-card { cursor: pointer; padding: 12px 14px; }
.verdict-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); cursor: default; }
.verdict-head { display: flex; align-items: center; gap: 8px; }
.verdict-head .name { font-weight: 600; overflow-wrap: anywhere; }
.verdict-head .spacer { flex: 1; }
.chip { font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.pass { color: var(--pass); border-color: var(--pass); background: var(--pass-soft); }
.chip.fail { color: var(--fail); border-color: var(--fail); background: var(--fail-soft); }
details { margin: 10px 0; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.rubric { white-space: pre-wrap; font-size: 14px; margin-top: 6px; padding: 8px 10px; background: var(--bg); border-radius: 8px; }
.choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.choices button { padding: 8px; font-weight: 600; }
.choices button.on[data-label="pass"] { background: var(--pass-soft); border-color: var(--pass); color: var(--pass); }
.choices button.on[data-label="fail"] { background: var(--fail-soft); border-color: var(--fail); color: var(--fail); }
.choices button.on[data-label="skip"] { border-color: var(--muted); }
textarea { width: 100%; min-height: 48px; margin-top: 8px; font: inherit; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px; background: var(--bg); color: var(--fg); resize: vertical; }
.judge { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; }
.judge p { margin: 4px 0; }
.judge .label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.verdict-word { font-weight: 700; } .verdict-word.pass { color: var(--pass); } .verdict-word.fail { color: var(--fail); }
.hidden-note { color: var(--muted); }
.match.agree { color: var(--pass); } .match.disagree { color: var(--fail); font-weight: 600; }
.keys { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>runthrough · label</h1>
  <select id="scorer" aria-label="Rubric"></select>
  <span class="progress" id="progress"></span>
  <span class="spacer"></span>
  <button id="prev" title="Previous conversation (←)">← Prev</button>
  <button id="next" title="Next conversation (→)">Next →</button>
  <button id="todo" title="Next unlabelled verdict (U)">Next unlabelled</button>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<script>
"use strict";
// One page per conversation. Each rubric the judge scored it on is a row you label.
let conversations = [], labels = {}, view = [], ci = 0, vi = 0;
const revealed = new Set();
const $ = (id) => document.getElementById(id);

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

async function load() {
  const data = await (await fetch("/api/conversations")).json();
  conversations = data.conversations; labels = data.labels;
  const counts = {};
  for (const c of conversations) for (const v of c.verdicts) counts[v.scorer] = (counts[v.scorer] || 0) + 1;
  const total = Object.values(counts).reduce((a, b) => a + b, 0);
  const select = $("scorer");
  const all = el("option", null, `All rubrics (${total})`); all.value = "";
  select.replaceChildren(all);
  for (const s of Object.keys(counts).sort()) {
    const o = el("option", null, `${s} (${counts[s]})`); o.value = s; select.append(o);
  }
  applyFilter();
  nextUnlabelled(0, 0);
}

function applyFilter() {
  const scorer = $("scorer").value;
  view = conversations
    .map((c) => ({ ...c, verdicts: c.verdicts.filter((v) => !scorer || v.scorer === scorer) }))
    .filter((c) => c.verdicts.length);
  ci = 0; vi = 0;
}

const isLabelled = (v) => Boolean(labels[v.key]);

function nextUnlabelled(fromConv, fromVerdict) {
  const n = view.length;
  for (let k = 0; k <= n; k++) {
    const c = (fromConv + k) % n;
    const start = k === 0 ? fromVerdict : 0;
    const j = view[c].verdicts.findIndex((v, idx) => idx >= start && !isLabelled(v));
    if (j >= 0) { ci = c; vi = j; break; }
  }
  render();
}

function render() {
  const app = $("app");
  if (!view.length) { $("progress").textContent = ""; app.replaceChildren(el("p", "empty", "No judged conversations in these logs.")); return; }
  const all = view.flatMap((c) => c.verdicts);
  const done = all.filter(isLabelled).length;
  $("progress").textContent = `Conversation ${ci + 1} of ${view.length} · ${done} of ${all.length} verdicts labelled`;
  const conv = view[ci];

  const left = el("section", "card");
  const meta = el("p", "meta");
  meta.append(el("b", null, conv.sample_id), ` · epoch ${conv.epoch} · ${conv.log}`);
  left.append(meta);
  if (conv.description) left.append(el("p", "meta", `Tests: ${conv.description}`));
  if (conv.goal) left.append(el("p", "meta", `User wanted: ${conv.goal}`));
  const who = { user: "User", assistant: "Assistant", tool_call: "Tool call", tool_result: "Tool result", error: "Error" };
  for (const e of conv.transcript) {
    const box = el("div", `entry ${e.kind}`);
    box.append(el("span", "who", e.name ? `${who[e.kind]} · ${e.name}` : who[e.kind]));
    box.append(el("span", "body", e.text));
    left.append(box);
  }

  const aside = el("aside");
  const intro = el("div", "card");
  const doneHere = conv.verdicts.filter(isLabelled).length;
  intro.append(
    el("h2", null, `Rubrics for this conversation · ${doneHere} of ${conv.verdicts.length} labelled`),
    el("p", "summary", "For each rubric, decide whether the conversation passes it. The judge's verdict appears once you label."),
  );
  aside.append(intro);
  conv.verdicts.forEach((v, idx) => aside.append(verdictCard(v, idx, idx === vi)));

  const keys = el("div", "keys");
  for (const k of ["P pass", "F fail", "S skip", "↑ ↓ rubric", "← → conversation", "U next unlabelled", "J show judge"]) {
    const parts = k.split(" "); const last = parts.pop();
    const span = el("span"); for (const p of parts) span.append(el("kbd", null, p), " "); span.append(last); keys.append(span);
  }
  aside.append(keys);
  app.replaceChildren(left, aside);
}

function verdictCard(v, idx, active) {
  const label = labels[v.key];
  const card = el("div", `card verdict-card${active ? " active" : ""}`);
  if (!active) card.onclick = () => { vi = idx; render(); };

  const head = el("div", "verdict-head");
  head.append(el("span", "name", `${idx + 1}. ${v.scorer}`), el("span", "spacer"));
  head.append(label ? el("span", `chip ${label.label}`, `You: ${label.label}`) : el("span", "chip", "Not labelled"));
  card.append(head);

  const details = el("details");
  details.open = active;
  details.append(el("summary", null, "Rubric"), el("div", "rubric", v.rubric));
  card.append(details);

  const choices = el("div", "choices");
  for (const [value, text] of [["pass", "Pass"], ["fail", "Fail"], ["skip", "Skip"]]) {
    const b = el("button", label && label.label === value ? "on" : "", text);
    b.dataset.label = value;
    b.onclick = (e) => { e.stopPropagation(); vi = idx; save(value); };
    choices.append(b);
  }
  card.append(choices);

  if (active || (label && label.note)) {
    const note = el("textarea");
    note.placeholder = "Note (optional): why?";
    note.value = label ? label.note : "";
    note.dataset.key = v.key;
    note.onclick = (e) => e.stopPropagation();
    note.onchange = () => { if (labels[v.key]) save(labels[v.key].label, idx, false); };
    card.append(note);
  }

  const judge = el("div", "judge");
  if (label || revealed.has(v.key)) {
    const line = el("p");
    line.append(el("span", "label", "Judge: "), el("span", `verdict-word ${v.judge}`, v.judge.toUpperCase()));
    judge.append(line);
    if (v.judge_reasoning) judge.append(el("p", null, v.judge_reasoning));
    if (v.judge_evidence) judge.append(el("p", "meta", `Evidence: “${v.judge_evidence}”`));
    if (label && label.label !== "skip" && v.judge !== "unreadable") {
      const agree = label.label === v.judge;
      judge.append(el("p", `match ${agree ? "agree" : "disagree"}`, agree ? "✓ You agree with the judge." : "✗ You disagree with the judge."));
    }
  } else {
    judge.append(el("p", "hidden-note", "Judge's verdict hidden until you label, so it doesn't sway you (J to show)."));
  }
  card.append(judge);
  return card;
}

async function save(value, idx = vi, advance = true) {
  const v = view[ci].verdicts[idx];
  const box = document.querySelector(`textarea[data-key="${CSS.escape(v.key)}"]`);
  const note = box ? box.value : (labels[v.key] ? labels[v.key].note : "");
  const res = await fetch("/api/labels", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ key: v.key, label: value, note }),
  });
  if (!res.ok) { alert((await res.json()).error); return; }
  labels[v.key] = await res.json();
  if (advance) {
    const next = view[ci].verdicts.findIndex((x, j) => j > idx && !isLabelled(x));
    if (next >= 0) vi = next;
  }
  render();
}

function moveConversation(step) { ci = (ci + step + view.length) % view.length; vi = 0; render(); window.scrollTo({ top: 0 }); }
function moveVerdict(step) { const n = view[ci].verdicts.length; vi = (vi + step + n) % n; render(); }

$("prev").onclick = () => moveConversation(-1);
$("next").onclick = () => moveConversation(1);
$("todo").onclick = () => { nextUnlabelled(ci, vi + 1); window.scrollTo({ top: 0 }); };
$("scorer").onchange = () => { applyFilter(); nextUnlabelled(0, 0); };
document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!view.length) return;
  const actions = {
    p: () => save("pass"), f: () => save("fail"), s: () => save("skip"),
    ArrowRight: () => moveConversation(1), ArrowLeft: () => moveConversation(-1),
    ArrowDown: () => moveVerdict(1), ArrowUp: () => moveVerdict(-1),
    u: () => nextUnlabelled(ci, vi + 1),
    j: () => { const k = view[ci].verdicts[vi].key; revealed.has(k) ? revealed.delete(k) : revealed.add(k); render(); },
  };
  const action = actions[e.key];
  if (action) { e.preventDefault(); action(); }
});
load();
</script>
</body>
</html>
